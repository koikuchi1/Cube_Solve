<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>逆手順</title>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { text-align: center; }
    h2 { text-align: center; }
    .container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; }
    .card { border: 1px solid #ccc; padding: 10px; width: 300px; text-align: center; }
    .card img { width: 20%; height: auto; }
    .arrow { font-size: 2em; font-weight: bold; }
    .latex { font-family: 'Courier New', monospace; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>OLL</h1>
  <h2>逆手順</h2>
  <div id="content" class="container"></div>

  <script>
    fetch('cube_solve.json')
      .then(response => response.json())
      .then(data => {
        const num33 = data.find(item => item["ナンバー"] === "33");
        const num37 = data.find(item => item["ナンバー"] === "37");

        const container = document.getElementById('content');

        function createCard(info) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <p>${info["タイプ"]} No.${info["ナンバー"]}</p>
            <p>${info["愛称"]}</p>
            <img src="images/OLL/${info["画像"]}" alt="${info["ナンバー"]}">
            <div class="latex">$$${info["手順"]}$$</div>
            <p>${info["手順略称"]}</p>
          `;
          return card;
        }

        // 左右に並べる: 左33 ⇔ 右37
        container.appendChild(createCard(num33));
        const arrow = document.createElement('div');
        arrow.className = 'arrow';
        arrow.textContent = '⇔';
        container.appendChild(arrow);
        container.appendChild(createCard(num37));

        MathJax.typesetPromise();
      })
      .catch(err => console.error('JSON読み込みエラー:', err));
  </script>
</body>
</html>
