<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>逆手順</title>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h2 {
      text-align: center;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      border: 1px solid #ccc;
      padding: 10px;
      width: 300px;
      text-align: center;
    }
    .card img {
      width: 10%; /* 元のサイズの10% */
      height: auto;
    }
    .arrow {
      font-size: 2em;
      font-weight: bold;
    }
    .latex {
      font-family: 'Courier New', monospace;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>逆手順</h2>
  <div id="content" class="container"></div>

  <script>
    fetch('cube_solve.json')
      .then(response => response.json())
      .then(data => {
        const num33 = data.find(item => item["ナンバー"] === "33");
        const num37 = data.find(item => item["ナンバー"] === "37");

        const container = document.getElementById('content');

        // No.37 のカード
        const card37 = document.createElement('div');
        card37.className = 'card';
        card37.innerHTML = `
          <p>${num37["タイプ"]} No.${num37["ナンバー"]}</p>
          <p>${num37["愛称"]}</p>
          <img src="images/OLL/${num37["画像"]}" alt="${num37["ナンバー"]}">
          <div class="latex">$$${num37["手順"]}$$</div>
          <p>${num37["手順略称"]}</p>
        `;

        // ⇔
        const arrow = document.createElement('div');
        arrow.className = 'arrow';
        arrow.textContent = '⇔';

        // No.33 のカード
        const card33 = document.createElement('div');
        card33.className = 'card';
        card33.innerHTML = `
          <p>${num33["タイプ"]} No.${num33["ナンバー"]}</p>
          <p>${num33["愛称"]}</p>
          <img src="images/OLL/${num33["画像"]}" alt="${num33["ナンバー"]}">
          <div class="latex">$$${num33["手順"]}$$</div>
          <p>${num33["手順略称"]}</p>
        `;

        container.appendChild(card37);
        container.appendChild(arrow);
        container.appendChild(card33);

        MathJax.typesetPromise();
      })
      .catch(error => console.error(error));
  </script>
</body>
</html>
