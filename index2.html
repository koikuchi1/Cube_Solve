<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OLL関連性</title>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { text-align: center; }
    h2 { text-align: center; }

    /* ペア同士は縦並び */
    #content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;         /* ペア間の間隔 */
      margin-top: 20px;
    }

    /* 1つのペア内は横並び */
    .pair {
      display: flex;
      align-items: center;
      gap: 20px;         /* カードと ⇔ の間隔 */
    }

    .card {
      border: 1px solid #ccc;
      padding: 10px;
      width: 300px;
      text-align: center;
    }
    .card img { width: 20%; height: auto; }
    .arrow { font-size: 2em; font-weight: bold; }
    .latex { font-family: 'Courier New', monospace; margin-top: 10px; }
  </style>

</head>
<body>
  <h1>OLL</h1>
  <h2>逆手順</h2>
  <div id="content" class="container"></div>

  <script>
    fetch('cube_solve.json')
      .then(r => r.json())
      .then(data => {
        const content = document.getElementById('content');

        const byNo = no => data.find(it => it["ナンバー"] === no);

        const createCard = (info) => {
          const c = document.createElement('div');
          c.className = 'card';
          c.innerHTML = `
            <p>${info["タイプ"]} No.${info["ナンバー"]}</p>
            <p>${info["愛称"]}</p>
            <img src="images/OLL/${info["画像"]}" alt="${info["ナンバー"]}">
            <div class="latex">$$${info["手順"]}$$</div>
            <p>${info["手順略称"]}</p>
          `;
          return c;
        };

        const addPair = (leftNo, rightNo) => {
          const left = byNo(leftNo);
          const right = byNo(rightNo);
          if (!left || !right) {
            console.warn('見つからない番号があります:', leftNo, rightNo);
            return;
          }
          const pair = document.createElement('div');
          pair.className = 'pair';
          pair.appendChild(createCard(left));

          const arrow = document.createElement('div');
          arrow.className = 'arrow';
          arrow.textContent = '⇔';
          pair.appendChild(arrow);

          pair.appendChild(createCard(right));
          content.appendChild(pair);
        };

        // ペア1: 左33 ⇔ 右37（横並び）
        addPair("33", "37");
        // ペア2: 左27 ⇔ 右26-1（横並び）
        addPair("27", "26-1");

        MathJax.typesetPromise();
      })
      .catch(e => console.error('JSON読み込みエラー:', e));
  </script>

</body>
</html>
